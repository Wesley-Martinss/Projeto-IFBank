<div class="cadastro-page">

  <!-- Painel esquerdo -->
  <div class="cadastro-side">
    <div class="side-circle side-circle-1"></div>
    <div class="side-circle side-circle-2"></div>
    <div class="side-logo">🏦</div>
    <h1 class="side-brand">IFSPBank</h1>
    <p class="side-tagline">Sua conta bancária<br>pronta em minutos</p>
  </div>

  <!-- Formulário -->
  <div class="cadastro-main">
    <div class="cadastro-card">

      <div class="card-logo-mobile">
        <div class="card-logo-icon">🏦</div>
        <span class="card-logo-name">IFSPBank</span>
      </div>

      <h2 class="cadastro-heading">Criar conta</h2>
      <p class="cadastro-sub">Preencha seus dados para começar</p>

      <form [formGroup]="cadastroForm" (ngSubmit)="onSubmit()">

        <div class="field">
          <label>Nome completo</label>
          <input type="text" formControlName="nome" placeholder="Seu nome completo" />
        </div>

        <div class="field">
          <label>E-mail</label>
          <input type="email" formControlName="email" placeholder="seu@email.com" />
        </div>

        <div class="field-row">
          <div class="field">
            <label>Senha</label>
            <input type="password" formControlName="senha" placeholder="••••••••" />
          </div>
          <div class="field">
            <label>CPF</label>
            <input type="text" formControlName="cpf" placeholder="000.000.000-00" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Data de nascimento</label>
            <input type="date" formControlName="dataNascimento" />
          </div>
          <div class="field">
            <label>Telefone</label>
            <input type="text" formControlName="telefone" placeholder="(11) 99999-9999" />
          </div>
        </div>

        <div class="field">
          <label>Endereço</label>
          <input type="text" formControlName="endereco" placeholder="Rua, número, cidade" />
        </div>

        <button type="submit" class="btn-cadastrar" [disabled]="cadastroForm.invalid">
          Criar conta
        </button>

        <p class="login-link">
          Já tem conta? <a routerLink="/login">Entrar</a>
        </p>

      </form>
    </div>
  </div>

</div>
