<div class="login-page">

  <!-- Painel esquerdo (visível em telas largas) -->
  <div class="login-side">
    <div class="side-circle side-circle-1"></div>
    <div class="side-circle side-circle-2"></div>
    <div class="side-logo">🏦</div>
    <h1 class="side-brand">IFSPBank</h1>
    <p class="side-tagline">Segurança e praticidade<br>para o seu dia a dia</p>
  </div>

  <!-- Formulário -->
  <div class="login-main">
    <div class="login-card">

      <!-- Logo mobile -->
      <div class="card-logo-mobile">
        <div class="card-logo-icon">🏦</div>
        <span class="card-logo-name">IFSPBank</span>
      </div>

      <h2 class="login-heading">Bem-vindo de volta</h2>
      <p class="login-sub">Acesse sua conta</p>

      <div class="field">
        <label>E-mail</label>
        <input type="email" placeholder="seu@email.com" [(ngModel)]="email" autocomplete="off" />
      </div>

      <div class="field">
        <label>Senha</label>
        <input type="password" placeholder="••••••••" [(ngModel)]="senha" (keyup.enter)="entrar()" />
      </div>

      @if (erro) {
        <div class="alert-erro">{{ erro }}</div>
      }

      <button class="btn-entrar" (click)="entrar()" [disabled]="carregando">
        {{ carregando ? 'Entrando...' : 'Entrar' }}
      </button>

      <p class="cadastro-link">
        Não tem conta? <a routerLink="/cadastro">Criar agora</a>
      </p>
    </div>
  </div>

</div>
